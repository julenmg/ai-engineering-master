services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/project/app
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
